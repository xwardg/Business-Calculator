<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Business Calculator</title>
</head>
<body>
  <h2>Business Billing Calculator</h2>
  <form method="POST">
    <label>Material Cost: <input type="number" step="0.01" name="materialcost" required></label><br><br>
    <label>Material Percentage Charge: <input type="number" step="0.01" name="matpercent1" required></label><br><br>
    <label>Jordan's Hourly Pay: <input type="number" step="0.01" name="jhourly" required></label><br><br>
    <label>Jordan's Per Diem: <input type="number" step="0.01" name="jpd" required></label><br><br>
    <label>Jordan's Hours: <input type="number" step="0.01" name="Jhours" required></label><br><br>
    <label>Jordan's Days: <input type="number" step="0.01" name="Jdays" required></label><br><br>
    <label>Total Employee Hours: <input type="number" step="0.01" name="Whours" required></label><br><br>
    <label>Total Per Diem of Employees: <input type="number" step="0.01" name="wpd" required></label><br><br>
    <input type="submit" value="Calculate">
  </form>

  {% if totalcost is not none %}
    <h3>Total Bill to Client: {{ totalcost }}</h3>
  {% endif %}
</body>
</html>
